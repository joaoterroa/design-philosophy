<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northwind review links</title><style>body{font:18px system-ui;margin:48px;line-height:1.6;color:#12355b}table{border-collapse:collapse}td,th{padding:12px 24px;text-align:left;border-bottom:1px solid #c9d2db}a{color:#12355b}a:focus-visible{outline:3px solid #12355b}p{max-width:750px}</style><h1>Northwind prototype review</h1><p>Open these links from disk. Set the browser viewport to TV 1920×1080 or laptop 1440×900. These review links sit outside the product.</p><table><thead><tr><th>State</th><th>TV · light</th><th>TV · dark</th><th>Laptop · light</th><th>Laptop · dark</th></tr></thead><tbody id="links"></tbody></table><script>document.querySelector('#links').innerHTML=['live','stale','surge'].map(s=>`<tr><th>${s}</th>${['tv','laptop'].flatMap(d=>['light','dark'].map(t=>`<td><a href="app/index.html?screen=${s}&theme=${t}&display=${d}">Open ${s}</a></td>`)).join('')}</tr>`).join('')</script><p><a href="app/index.html">System theme / default state</a> · <a href="DESIGN.md">Design notes</a></p></html>
