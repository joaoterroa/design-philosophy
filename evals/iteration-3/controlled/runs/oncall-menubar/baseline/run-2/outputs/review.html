<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rota prototype review</title><style>body{font:14px system-ui;background:#e7e9ec;margin:24px;color:#202124}button,a{margin:4px;padding:8px}iframe{display:block;width:400px;height:680px;border:0;margin-top:16px}p{max-width:650px}</style></head><body><h1>Rota review harness</h1><p>Offline simulation only. Use the app to choose Priya, review and send. This explicit action simulates Priya’s acceptance; no backend is contacted.</p><button id="accept">Simulate Priya accepting</button><button id="reset">Reset flow</button><a href="app/index.html?screen=main">Open standalone app</a><p id="status" role="status"></p><iframe id="prototype" title="Rota prototype" src="app/index.html?screen=main&theme=light"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#accept').onclick=()=>{f.contentWindow.postMessage({type:'rota-simulate-accept'},'*');document.querySelector('#status').textContent='Acceptance sent to preview. It applies only when a handover is pending.'};document.querySelector('#reset').onclick=()=>{f.src='app/index.html?screen=main&theme=light';document.querySelector('#status').textContent='Flow reset.'};</script></body></html>
