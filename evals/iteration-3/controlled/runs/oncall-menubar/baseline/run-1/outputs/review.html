<!doctype html><html lang="en"><meta charset="utf-8"><title>Rota review harness</title><style>body{font:14px system-ui;background:#dfe3e5;margin:24px}button,select{font:inherit;padding:8px;margin:4px}iframe{display:block;width:400px;height:680px;border:0;margin-top:12px}p{max-width:560px}</style><h1>Rota review harness</h1><p>Prototype controls outside the product. Acceptance represents a separate event from Priya; it never happens automatically.</p><label>State <select id="state"><option>main</option><option>compose</option><option>pending</option><option>offline</option><option>empty</option><option>accepted</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><button id="open">Open state</button><button id="accept">Simulate Priya accepting</button><p id="status" role="status"></p><iframe id="preview" title="Rota prototype" src="app/index.html?screen=main&theme=light"></iframe><script>const frame=document.getElementById('preview');document.getElementById('open').onclick=()=>{frame.src='app/index.html?screen='+document.getElementById('state').value+'&theme='+document.getElementById('theme').value};document.getElementById('accept').onclick=()=>{frame.contentWindow.postMessage({type:'rota:accept'},'*');document.getElementById('status').textContent='Acceptance event sent. Only a pending request can be accepted.'};</script></html>
