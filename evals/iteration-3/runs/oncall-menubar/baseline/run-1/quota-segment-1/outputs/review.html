<!doctype html><html lang="en"><meta charset="utf-8"><title>Prototype review harness</title><style>body{font:16px system-ui;margin:24px;background:#e9ebef;color:#20252c}label,button,select{font:inherit;padding:8px}header{display:flex;gap:16px;align-items:center;margin-bottom:20px}iframe{border:1px solid #aaa;background:white;width:400px;height:680px}p{max-width:700px}</style><header><strong>Review harness</strong><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><button id="accept">Simulate Priya accepting</button></header><p>This separate harness is the simulated recipient. In Rota, choose Priya, review and send first. Acceptance is an explicit action here and never happens on a timer. All data is local; no request or SMS is sent.</p><iframe title="Rota prototype" src="app/index.html?screen=main&theme=light" id="preview"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#accept').onclick=()=>frame.contentWindow.postMessage('simulate-acceptance','*');document.querySelector('#theme').onchange=e=>frame.src='app/index.html?screen=main&theme='+e.target.value;</script></html>
