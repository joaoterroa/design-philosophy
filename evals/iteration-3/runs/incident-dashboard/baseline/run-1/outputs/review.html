<!doctype html><html lang="en"><meta charset="utf-8"><title>Prototype review</title><style>body{font:16px system-ui;margin:24px;background:#eef1f4;color:#12355b}label{margin-right:16px}select,button{font:inherit;padding:8px}iframe{display:block;background:white;margin-top:24px;border:1px solid #b7c3cd;max-width:none}p{max-width:750px}a{color:inherit}</style><h1>Offline prototype review</h1><p>This harness sits outside the product. Choose a required state, theme and viewport. The app itself has no state switcher. Dashboard incident data is a fixed snapshot; handovers and banking messages are local simulations.</p><label>Screen <select id="screen"><optgroup label="Dashboard"><option>live</option><option>stale</option><option>surge</option></optgroup><optgroup label="Rota"><option>main</option><option>compose</option><option>pending</option><option>offline</option><option>empty</option><option>accepted</option></optgroup><optgroup label="Harbour"><option>welcome</option><option>details-error</option><option>code</option><option>code-error</option><option>help</option><option>done</option></optgroup></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><label>Viewport <select id="size"><option value="1440,900,laptop">Laptop 1440 × 900</option><option value="1920,1080,tv">TV 1920 × 1080</option><option value="400,680,laptop">Popover 400 × 680</option><option value="390,844,laptop">Phone 390 × 844</option><option value="320,568,laptop">Phone 320 × 568</option></select></label><button id="open">Open separately</button><iframe id="preview" title="Offline product preview"></iframe><script>const s=document.getElementById('screen'),t=document.getElementById('theme'),z=document.getElementById('size'),f=document.getElementById('preview');function update(){const[w,h,d]=z.value.split(',');f.width=w;f.height=h;f.src='app/index.html?screen='+s.value+'&theme='+t.value+'&display='+d}for(const e of [s,t,z])e.onchange=update;document.getElementById('open').onclick=()=>window.open(f.src,'_blank');s.addEventListener('change',()=>{z.value=['live','stale','surge'].includes(s.value)?'1440,900,laptop':['main','compose','pending','offline','empty','accepted'].includes(s.value)?'400,680,laptop':'390,844,laptop';update()});update();</script></html>
