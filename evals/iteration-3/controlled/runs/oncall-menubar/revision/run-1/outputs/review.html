<!doctype html><html lang="en"><meta charset="utf-8"><title>Rota · review harness</title><style>body{font:14px system-ui;background:#eee;margin:24px;color:#243029;display:flex;gap:32px}iframe{width:400px;height:680px;border:0}aside{max-width:330px}button,select{font:inherit;padding:10px;margin:6px 0;display:block}p{line-height:1.5}</style><iframe id="product" title="Rota offline prototype" src="app/index.html?screen=main&theme=light"></iframe><aside><h1>Rota review harness</h1><p>This page is outside the product. In the app, choose Priya, review and send a handover. Then use the explicit acceptance action below. Requests never accept automatically.</p><button id="accept">Simulate Priya accepting</button><p id="message" role="status"></p><label for="state">Open a state</label><select id="state"><option>main</option><option>compose</option><option>pending</option><option>offline</option><option>empty</option><option>accepted</option></select><label for="theme">Theme</label><select id="theme"><option>light</option><option>dark</option></select><p>Fixture data only. No request is sent to a person or service.</p></aside><script>const frame=document.querySelector('iframe');document.querySelector('#accept').onclick=()=>{frame.contentWindow.postMessage({type:'rota-review-accept'},'*');document.querySelector('#message').textContent='Acceptance signal sent. It applies only to a pending request.'};function openState(){frame.src='app/index.html?screen='+document.querySelector('#state').value+'&theme='+document.querySelector('#theme').value}document.querySelector('#state').onchange=openState;document.querySelector('#theme').onchange=openState;</script></html>
