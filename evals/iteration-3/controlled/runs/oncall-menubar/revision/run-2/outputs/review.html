<!doctype html><html lang="en"><meta charset="utf-8"><title>Rota review harness</title><style>body{margin:24px;background:#e8eaed;color:#24272d;font:14px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;gap:32px}aside{width:280px}iframe{border:0;width:400px;height:680px}button,a,select{display:block;margin:12px 0;padding:10px;font:inherit}p{line-height:1.5}</style><aside><h1>Rota review harness</h1><p>Offline prototype. No requests are sent to a backend. Controls here are outside the product canvas.</p><label for="screen">Open a state</label><select id="screen"><option>main</option><option>compose</option><option selected>pending</option><option>offline</option><option>empty</option><option>accepted</option></select><label for="theme">Theme</label><select id="theme"><option>light</option><option>dark</option></select><button id="accept">Simulate Priya accepting</button><p>Acceptance requires a pending request. It never happens on a timer. Use the app’s handover flow or open Pending, then activate this button.</p><a href="app/index.html">Open app on its own</a></aside><iframe id="preview" title="Rota prototype" src="app/index.html?screen=pending&theme=light"></iframe><script>const frame=document.querySelector('#preview');function openState(){frame.src='app/index.html?screen='+document.querySelector('#screen').value+'&theme='+document.querySelector('#theme').value}document.querySelector('#screen').onchange=openState;document.querySelector('#theme').onchange=openState;document.querySelector('#accept').onclick=()=>frame.contentWindow.postMessage({type:'rota:accept'},'*');</script></html>
