<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype review harness</title><style>body{font:15px system-ui;background:#e6e7eb;color:#202127;margin:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,select,a{font:inherit;padding:8px}iframe{width:400px;height:680px;border:1px solid #999;background:#e1e3e8}button:focus-visible,a:focus-visible{outline:3px solid #185bc5}p{max-width:650px}</style><h1>Prototype review</h1><p>These controls are outside the product. No request, text message or live connection is made.</p><nav><label>State <select id="state"><optgroup label="Rota"><option>main</option><option>compose</option><option>pending</option><option>offline</option><option>empty</option><option>accepted</option></optgroup><optgroup label="Northwind"><option>live</option><option>stale</option><option>surge</option></optgroup><optgroup label="Harbour"><option>welcome</option><option>details-error</option><option>code</option><option>code-error</option><option>help</option><option>done</option></optgroup></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><button id="load">Open state</button><button id="accept">Simulate Priya accepting</button><a href="app/index.html" target="_blank">Open app in a new tab</a></nav><iframe id="preview" title="Product preview" src="app/index.html?screen=main&theme=light"></iframe><script>const frame=document.getElementById('preview');document.getElementById('load').onclick=()=>{const s=document.getElementById('state').value;frame.src='app/index.html?screen='+s+'&theme='+document.getElementById('theme').value+'&display=laptop';if(['live','stale','surge'].includes(s)){frame.style.width='1440px';frame.style.height='900px';}else{frame.style.width=['main','compose','pending','offline','empty','accepted'].includes(s)?'400px':'390px';frame.style.height=['main','compose','pending','offline','empty','accepted'].includes(s)?'680px':'844px';}};document.getElementById('accept').onclick=()=>frame.contentWindow.postMessage('simulate-acceptance','*');</script></html>
