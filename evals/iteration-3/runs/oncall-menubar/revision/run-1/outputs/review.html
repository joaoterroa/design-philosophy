<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rota prototype review</title><style>body{font:14px system-ui;background:#e9eceb;color:#242c29;padding:24px;margin:0}main{display:flex;gap:32px;align-items:flex-start}aside{width:310px}h1{font-size:24px}p{line-height:1.5}label{display:block;margin-top:16px}select,button{font:inherit;padding:10px;margin-top:6px;border:1px solid #7b8780;border-radius:6px;background:#fafbf9;color:#242c29}button{display:block}iframe{width:400px;height:680px;border:1px solid #a1aaa4;border-radius:10px}a{color:#245b46}:focus-visible{outline:3px solid #2967a5;outline-offset:3px}</style></head><body><main><iframe id="prototype" title="Rota prototype" src="app/index.html?screen=main&theme=light"></iframe><aside><h1>Rota review harness</h1><p>Local fixture prototype. These controls belong to the review harness, outside the product.</p><label for="state">Open state</label><select id="state"><option>main</option><option>compose</option><option>review</option><option>pending</option><option>offline</option><option>empty</option><option>accepted</option></select><label for="theme">Theme</label><select id="theme"><option>light</option><option>dark</option></select><button id="open">Open selected state</button><button id="accept">Simulate Priya accepting</button><p id="result" role="status">Acceptance is a separate, explicit action. Start a handover or open pending before simulating it.</p><p><a href="app/index.html?screen=main">Open the standalone popover</a></p></aside></main><script>const frame=document.querySelector('iframe');document.querySelector('#open').onclick=()=>{frame.src='app/index.html?screen='+document.querySelector('#state').value+'&theme='+document.querySelector('#theme').value;document.querySelector('#result').textContent='Opened selected fixture state.'};document.querySelector('#accept').onclick=()=>{frame.contentWindow.postMessage({type:'rota:simulate-acceptance'},'*');document.querySelector('#result').textContent='Acceptance simulation sent. Only a pending handover can be accepted.'};</script></body></html>
